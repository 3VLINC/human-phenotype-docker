# Publishes Python and Node API images to Docker Hub (hub.docker.com).
# Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Hub access token with push to threevl/hpo and threevl/hpo-node).
name: Publish Docker Hub images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g. latest or a release identifier)"
        required: true
        default: "latest"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Python API (threevl/hpo)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: threevl/hpo:${{ steps.meta.outputs.tag }}

      - name: Build and push Node API (threevl/hpo-node)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: threevl/hpo-node:${{ steps.meta.outputs.tag }}
